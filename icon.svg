<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Touch Shim">
  <title>Touch Shim</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f2a"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
  </defs>
  <rect x="28" y="28" width="344" height="344" rx="76" fill="url(#tile)" stroke="#2a2a36" stroke-width="2"/>
  <!-- band-aid / plaster: a stopgap patch (each shim is deleted the release upstream fixes the bug) -->
