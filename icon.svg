    <rect x="92" y="160" width="216" height="80" rx="40" fill="none" stroke="#ffb02e" stroke-width="18"/>
    <rect x="168" y="160" width="64" height="80" fill="#ffb02e" fill-opacity="0.16" stroke="#ffb02e" stroke-width="9"/>
    <g fill="#ffb02e">
      <circle cx="184" cy="181" r="5"/><circle cx="200" cy="181" r="5"/><circle cx="216" cy="181" r="5"/>
      <circle cx="184" cy="200" r="5"/><circle cx="200" cy="200" r="5"/><circle cx="216" cy="200" r="5"/>
      <circle cx="184" cy="219" r="5"/><circle cx="200" cy="219" r="5"/><circle cx="216" cy="219" r="5"/>
    </g>
  </g>
</svg>
