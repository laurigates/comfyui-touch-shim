<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-label="Touch Shim">
  <title>Touch Shim</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b4332"/>
      <stop offset="1" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1400" height="400" fill="url(#bg)"/>
  <text x="80" y="188" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="104" font-weight="700" dominant-baseline="middle">Touch Shim</text>
  <text x="84" y="272" fill="#95d5b2" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="40" font-weight="400" dominant-baseline="middle">Small stopgap mobile/touch QOL fixes for upstream ComfyUI frontend bugs — each shim toggleable and deletable once fixed upstream.</text>
</svg>
