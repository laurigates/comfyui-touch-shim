[project]
name = "comfyui-touch-shim"
description = "Small stopgap mobile/touch QOL fixes for upstream ComfyUI frontend bugs — each shim toggleable and deletable once fixed upstream."
version = "0.1.6"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lauri Gates" }]
keywords = ["comfyui", "comfyui-nodes", "ui", "shim", "accessibility", "mobile", "touch"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Topic :: Multimedia :: Graphics",
]

# Floor tied to the registerExtension action-bar/command API. Frontend-only pack — no runtime Python deps.
dependencies = [
    "comfyui-frontend-package>=1.40.0",
]

[project.urls]
Repository = "https://github.com/laurigates/comfyui-touch-shim"
Issues = "https://github.com/laurigates/comfyui-touch-shim/issues"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pre-commit>=4",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.comfy]
PublisherId = "laurigates"
DisplayName = "Touch Shim"
# Registry display assets. The registry fetches these by URL from the repo's
# default branch, so the PNGs must exist at the repo root on `main`. The scaffold
# ships icon.svg / banner.svg (source form); run `just assets` (rsvg-convert) to
# rasterize them to icon.png / banner.png and commit those before publishing.
Icon = "https://raw.githubusercontent.com/laurigates/comfyui-touch-shim/main/icon.png"
Banner = "https://raw.githubusercontent.com/laurigates/comfyui-touch-shim/main/banner.png"
# The built frontend (web/dist/) is committed (tracked) — emitted by `bun run build`.
# publish-node-action honors [tool.comfy] includes to force-add otherwise-
# ignored paths into the published tarball. See ADR-0001.
includes = ["web/dist"]
